<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Umbra phase cycle</title>
  <desc id="desc">An animated moon phase loop cycling through the personal markers 30, 15 and 0.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1c"/><stop offset="1" stop-color="#16264a"/></linearGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f4f7ff"/><stop offset="0.72" stop-color="#c7d4f1"/><stop offset="1" stop-color="#91a5d0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9fb3df" stroke-opacity="0.08"/></pattern>
    <style>
      .motion { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <rect width="760" height="300" rx="28" fill="url(#sky)"/>
  <rect x="16" y="16" width="728" height="268" rx="20" fill="url(#grid)"/>
  <rect x="16" y="16" width="728" height="268" rx="20" fill="none" stroke="#8da5d4" stroke-opacity="0.35"/>

  <g transform="translate(48 44)">
    <circle cx="112" cy="102" r="82" fill="url(#moon)"/>
    <circle cx="84" cy="76" r="10" fill="#91a5d0" fill-opacity="0.36"/>
    <circle cx="140" cy="132" r="16" fill="#91a5d0" fill-opacity="0.26"/>
    <circle cx="128" cy="54" r="6" fill="#91a5d0" fill-opacity="0.42"/>

    <g class="motion">
      <path d="M30 159C74 194 145 202 202 168" fill="none" stroke="#6ee7f2" stroke-width="2" stroke-opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 112 102;360 112 102" dur="30s" repeatCount="indefinite"/>
      </path>
      <path d="M37 40C87 -4 166 -7 207 30" fill="none" stroke="#f7c873" stroke-width="2" stroke-opacity="0.85" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" values="0 112 102;-360 112 102" dur="30s" repeatCount="indefinite"/>
      </path>
      <circle cx="204" cy="30" r="5" fill="#f7c873"/>
      <circle cx="30" cy="159" r="4" fill="#6ee7f2"/>
    </g>

    <!-- The moving dark disk is the umbra: a visual metaphor, not a literal astronomical model. -->
    <circle class="motion" cx="45" cy="102" r="82" fill="#080d1c">
      <animate attributeName="cx" values="45;112;179;112;45" keyTimes="0;0.25;0.5;0.75;1" dur="30s" repeatCount="indefinite"/>
    </circle>
    <path d="M196 46A82 82 0 0 1 197 139" fill="none" stroke="#edf3ff" stroke-opacity="0.45" stroke-width="3"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="48" y="204" fill="#9fb3df">30</text>
      <text x="112" y="204" fill="#9fb3df">15</text>
      <text x="176" y="204" fill="#9fb3df">0</text>
      <path d="M48 214H176" stroke="#3a527c" stroke-width="2"/>
      <circle class="motion" cx="48" cy="214" r="5" fill="#f7c873">
        <animate attributeName="cx" values="48;112;176;112;48" keyTimes="0;0.25;0.5;0.75;1" dur="30s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g fill="#edf3ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="302" y="106" font-size="42" font-weight="700" letter-spacing="8">UMBRA</text>
    <text x="307" y="143" font-size="15" fill="#9fb3df" letter-spacing="4">STATE / IN ORBIT</text>
    <text x="307" y="187" font-size="18" fill="#d7e2ff">the shadow moves, the learner stays</text>
    <text x="307" y="220" font-size="14" fill="#6ee7f2">phase loop: 30 → 15 → 0 → 15 → 30</text>
    <text x="307" y="250" font-size="12" fill="#f7c873">just a personal rhythm, not a measurement</text>
  </g>

  <g fill="#9fb3df" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <text x="42" y="268">UMBRA CYCLE / v0.1 / ALWAYS LEARNING</text>
    <text x="690" y="268" text-anchor="end">51430150</text>
  </g>
</svg>
